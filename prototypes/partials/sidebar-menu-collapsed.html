<!--
  APTIEN — LEVÉ MENU (sidebar) · SBALENÝ (COLLAPSED) STAV = **VÝCHOZÍ**
  =====================================================================
  ⭐ Toto je VÝCHOZÍ stav menu — při generování obrazovky použij VŽDY tento
  soubor, pokud zadání výslovně nežádá otevřené (rozbalené) menu. Otevřený
  stav (220px s texty a badgi) je v `sidebar-menu.html` a použije se jen na
  výslovné zadání („otevřené menu", „rozbalený sidebar", „menu s texty").
  Odpovídá `sidebarCollapsed:true` v master prototypu
  `Aptien-aplikace-offline.html`.

  Struktura a pořadí položek jsou shodné s otevřeným stavem (16 + 7), jen
  bez textu a badgí — vidět jsou pouze ikony.

  ⛔ SBALENÉ MENU NEZOBRAZUJE POSUVNÍK. Obsah se dál roluje (23 položek se
  do 864 px nevejde), ale scrollbar je skrytý — `scrollbar-width:none`
  + `::-webkit-scrollbar { width:0 }` přes třídu `aptien-sb-collapsed`.
  V 56px pruhu by posuvník zabral desetinu šířky a rozsekal ikony.

  Co zůstává STEJNÉ jako v otevřeném stavu:
    - pořadí, počet (16 + 7) a ikony položek (stejné inline SVG),
    - aktivní stav: přesně JEDNA položka, zvýrazněná stejnou modrou tint
      barvou (rgba(21,114,232,.10)) — jen bez textu, celý řádek na výšku,
    - profil (persona) — pouze avatar, bez jména/role.

  Co se v tomto stavu MĚNÍ oproti otevřenému:
    - šířka nav: 56px (místo 220px),
    - žádné textové popisky ani nadpisy skupin („Můj pracovní prostor" /
      „Naše firma" úplně mizí — položky jdou v souvislé řadě, přesně jak
      to dělá master prototyp `Aptien-aplikace-offline.html`),
    - žádné badge (počty) — v collapsed stavu se nezobrazují vůbec,
    - šipka nahoře je `fa-angles-right`, zarovnaná na střed,
    - **žádný posuvník** (viz výše).

  Vlož tento blok CELÝ, jen přesuň aktivní stav (pozadí
  rgba(21,114,232,.10) + barvu ikony #1572e8) na položku odpovídající
  otevřené obrazovce — stejné pravidlo jako u otevřeného menu.

  Obsah vedle sidebaru (content area) má vždy `flex:1;min-width:0` — proti
  otevřenému menu se automaticky roztáhne o uvolněných ~164px, nic se
  nepočítá.
-->

  .aptien-sb-collapsed::-webkit-scrollbar { width: 0; height: 0; }
