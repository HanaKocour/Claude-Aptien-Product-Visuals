<!-- Ikony tohoto bloku jsou Font Awesome (Free). Řádek níže načte FA, aby se
     vykreslily i při samostatném otevření souboru. V master prototypu se FA
     načítá z jeho assetů, takže tam je tento <link> nadbytečný (neškodí). -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!--
  APTIEN — TOOLBAR EVIDENCE · STATICKÝ BLOK K DOSLOVNÉMU VLOŽENÍ
  =============================================================
  Patří NAD pohled (dashboard/seznam/kanban/tabulka). Skladba (viz
  Aptien-pravidla-pouziti-UI.md §5.1):
    ikona + název modulu → modré „PŘIDAT …" → hledání (pilulka) →
    hvězda/filtr → view switcher (VŽDY všech 5, aktivní modrá).
  Měň jen: název modulu, barvu ikony názvu (c800 modulu), text PŘIDAT.
  NEMĚŇ: modré tlačítko, modré přepínání pohledů, počet pohledů (5).
  Aktivní pohled = přesuň modrý styl na jiné tlačítko (tady Kanban).
-->
<div style="flex-shrink:0;padding:10px 20px;display:flex;align-items:center;gap:10px;font-family:'Nunito',sans-serif">
  <!-- Ikona + název modulu (ikona v barvě modulu c800; zde Zakázky #1565C0) -->
  <i class="fa-solid fa-briefcase" style="font-size:18px;color:#1565C0;flex-shrink:0"></i>
  <span style="font-size:16px;font-weight:800;color:#1e1b2e;flex-shrink:0">Zakázky</span>
  <i class="fa-solid fa-circle-info" style="color:#b0aac8;font-size:13px;cursor:pointer;flex-shrink:0"></i>

  <!-- Primární akce = VŽDY modré, bez ohledu na modul -->
  <div style="display:flex;align-items:center;gap:7px;background:#1572e8;color:#fff;font-size:11px;font-weight:800;padding:6px 14px;border-radius:999px;cursor:pointer;letter-spacing:.04em;white-space:nowrap;box-shadow:0 2px 6px rgba(21,114,232,.28);flex-shrink:0">
    <i class="fa-solid fa-plus" style="font-size:10px"></i>PŘIDAT ZAKÁZKU
  </div>

  <!-- Hledání (pilulka) -->
  <div style="display:flex;align-items:center;gap:7px;background:#f2f5f7;border:1px solid transparent;border-radius:999px;padding:5px 14px;flex-shrink:0;width:190px">
    <i class="fa-solid fa-magnifying-glass" style="color:#b0aac8;font-size:12px"></i>
    <span style="font-size:12px;color:#c0bdd0">Hledej...</span>
  </div>

  <i class="fa-regular fa-star" style="color:#c5c0d8;font-size:15px;cursor:pointer;flex-shrink:0"></i>
  <i class="fa-solid fa-filter" style="color:#c5c0d8;font-size:13px;cursor:pointer;flex-shrink:0"></i>

  <div style="flex:1"></div>

  <!-- View switcher: VŽDY všech 5, aktivní = modrá -->
  <div style="display:flex;align-items:center;gap:6px">
    <div style="display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid #c8c4d8;background:#fff;color:#3d3a52"><i class="fa-solid fa-table-cells-large" style="font-size:12px"></i>Dashboard</div>
    <div style="display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid #c8c4d8;background:#fff;color:#3d3a52"><i class="fa-solid fa-list" style="font-size:12px"></i>Seznam</div>
    <div style="display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid #1572e8;background:#e8f0fd;color:#1572e8"><i class="fa-solid fa-table-columns" style="font-size:12px"></i>Kanban</div>
    <div style="display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid #c8c4d8;background:#fff;color:#3d3a52"><i class="fa-solid fa-table" style="font-size:12px"></i>Tabulka</div>
    <div style="display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid #c8c4d8;background:#fff;color:#3d3a52"><i class="fa-solid fa-calendar" style="font-size:12px"></i>Kalendář</div>
  </div>
</div>
