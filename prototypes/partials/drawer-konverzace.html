<style>

  .kv-drawer .commentItem.toRight{float:right;}

  .kv-drawer .commentItem.toRight .item-Content{text-align:right;}
  .kv-drawer .commentItem.toRight .item-Content .comment{text-align:left;color:#fff;}
  .kv-drawer .commentItem.toRight .item-Content .comment-info{text-align:right;}
  .kv-drawer .commentItem.toRight .item-Avatar{margin:5px 0 10px 5px;}
</style>
