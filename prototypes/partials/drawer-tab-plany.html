<!--
  APTIEN — DRAWER, ZÁLOŽKA „PLÁNY AKTIVIT"
  =======================================
  OBSAH ZÁLOŽKY do slotu `item-drawer-shell.html` (nebo `-stacked.html`).
  Vlož CELÝ, neskládej z hlavy. Zdroj pravdy: master prototyp,
  blok `zam_showPlany` (modul Zaměstnanci).

  Skladba (pořadí je závazné):
    1. „PŘIDAT AKTIVITU" – SEKUNDÁRNÍ tlačítko: pilulka `radius:999px`,
       lem `1px solid #1572e8`, text `#1572e8`, bílé pozadí, bez stínu
       – NE plné, NE hranaté, NE barva modulu
    2. skupiny aktivit = karty s okrajem `#e9e7f1`:
       hlavička `#efeef4` (chevron + název `14/800` + tmavý počet + stavové
       chipy) → po rozbalení bílé tělo s řádky aktivit

  Stavové chipy v hlavičce (sémantické, NEPŘEBARVUJ na barvu modulu):
    V pořádku `#00C853` · Blížící se `#FFAB00` · Urgentní `#EF5350` ·
    nenaplánované `#78788c`

  ⚠ VÝCHOZÍ STAV: **VŠECHNY SKUPINY SBALENÉ** (pravidla §7.1.0).
     Tenhle soubor obsahuje právě takovou podobu – vlož ho tak, jak je.
     Rozbalenou skupinu použij JEN na výslovné zadání („rozbalená skupina
     Nástup zaměstnance") – hotové varianty (splněné aktivity / aktivity
     čekající na akci / hromadné akce) jsou v samostatném partialu
     `drawer-tab-plany-rozbaleno.html`; nahraď jimi hlavičku dané skupiny.

  ⛔ V ITEMU (draweru) SE BARVA MODULU NEPOUŽÍVÁ – tlačítka jsou vždy
     v defaultní modré `#1572e8`, bez ohledu na modul.

  Měň JEN data: názvy skupin, počty, chipy.
-->
