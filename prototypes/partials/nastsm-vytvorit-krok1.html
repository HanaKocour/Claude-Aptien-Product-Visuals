<!-- Ikony tohoto bloku jsou Font Awesome (Free) + Nunito. Řádky níže je načtou,
     aby se blok vykreslil i při samostatném otevření souboru. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!--
  APTIEN — SEZNAMY PŘÍJEMCŮ, MODAL „VYTVOŘIT“ (krok 1: Vyberte zdroj)
  =====================================================================
  Zdroj pravdy: reálná produkční aplikace (screenshot 27. 8. 2026) +
  master prototyp (`nsmCreateOpen`, §12.2).

  Jediný krok tohoto modalu: výběr TYPU zdroje (zatím jen jedna karta
  „Dokument nebo manuál“ — needitovatelný demo stav, proto je rovnou
  vybraná) + vyhledávací pole na konkrétní dokument. Tlačítko
  POKRAČOVAT vede do editačního modalu „Upravit seznam příjemců“
  (viz nastsm-upravit-seznam.html, §12.3) se stejnými daty zdroje.

  Modal je needitovatelná ukázka — pole „Vyberte zdroj*“ jen zobrazuje
  placeholder text, nereaguje na psaní.
-->
<style>
  body { font-family:'Nunito',sans-serif; }
  .apt-modal-overlay { position:fixed; inset:0; background:rgba(20,22,30,.55); display:flex; align-items:center; justify-content:center; }
  .apt-modal { width:min(700px,94vw); background:#fff; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .apt-modal-head { flex-shrink:0; display:flex; align-items:center; padding:18px 24px 14px; }
  .apt-modal-title { font-size:19px; font-weight:700; color:#3f4457; flex:1; }
  .apt-modal-close { font-size:19px; color:#8a90a3; cursor:pointer; line-height:1; }
  .apt-modal-foot { flex-shrink:0; display:flex; align-items:center; gap:12px; padding:14px 24px; background:#fff; border-top:1px solid #eeeff4; }
  .apt-f-label { font-size:12.5px; color:#5b6070; margin-bottom:6px; }
  .apt-f-input { background:#fff; border:1px solid #e2e5ef; border-radius:6px; height:34px; display:flex; align-items:center; padding:0 11px; font-size:13px; color:#2b2540; }
  /* Primární tlačítko = plná barva #1572e8 (pravidla UI, "Primární"), NE světlejší #4a7fe8. */
  .apt-btn-blue { display:inline-flex; align-items:center; gap:8px; background:#1572e8; color:#fff; font-size:12px; font-weight:700; letter-spacing:.03em; padding:9px 26px; border-radius:999px; cursor:pointer; white-space:nowrap; box-shadow:0 2px 6px rgba(21,114,232,.28); }
  .apt-btn-blue:hover { background:#0f50a2; }
  .nsm-step-banner { display:flex; align-items:center; justify-content:center; gap:9px; background:#eef4fe; color:#1572e8; font-size:14px; font-weight:700; padding:13px; border-radius:8px; margin-bottom:20px; }
  .nsm-card { position:relative; background:#fff; border:1.5px solid #e2e5ef; border-radius:8px; padding:14px 40px 14px 16px; cursor:pointer; }
  .nsm-card.selected { border-color:#1572e8; background:#f3f8ff; }
  .nsm-card-title { display:flex; align-items:flex-start; gap:9px; font-size:13.5px; font-weight:700; color:#2b2540; line-height:1.35; }
  .nsm-card-title i { color:#1572e8; font-size:13px; width:16px; text-align:center; flex-shrink:0; margin-top:1px; }
  .nsm-card-desc { font-size:12px; color:#8a90a3; margin-top:4px; margin-left:25px; }
  .nsm-card-mark { position:absolute; top:14px; right:14px; width:18px; height:18px; border-radius:50%; border:1.5px solid #c7cbd8; }
  .nsm-card.selected .nsm-card-mark { border-color:#1572e8; background:#1572e8; display:flex; align-items:center; justify-content:center; }
  .nsm-card.selected .nsm-card-mark::after { content:'\2713'; color:#fff; font-size:11px; line-height:1; }
</style>

<div class="apt-modal-overlay">
  <div class="apt-modal">
    <div class="apt-modal-head">
      <div class="apt-modal-title">Vytvořit seznam příjemců</div>
      <div class="apt-modal-close">✕</div>
    </div>
    <div style="padding:22px 26px 26px">
      <div class="nsm-step-banner"><i class="fa-solid fa-file-lines"></i>Vyberte zdroj</div>
      <div style="font-size:13px;color:#6b7280;margin-bottom:16px">Vyberte dokument nebo formulář jako zdroj pro tento list příjemců</div>
      <div class="nsm-card selected" style="margin-bottom:22px">
        <div class="nsm-card-mark"></div>
        <div class="nsm-card-title"><i class="fa-solid fa-file-lines"></i>Dokument nebo manuál</div>
        <div class="nsm-card-desc">Vyberte dokument jako zdroj pro tento list příjemců</div>
      </div>
      <div class="apt-f-label">Vyberte zdroj*</div>
      <div class="apt-f-input" style="color:#9096a6">Klikněte a začněte psát……</div>
    </div>
    <div class="apt-modal-foot">
      <div style="flex:1"></div>
      <div class="apt-btn-blue">POKRAČOVAT</div>
    </div>
  </div>
</div>
