<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aptien – menu &amp; app bar prototyp</title>

<!-- Fonty a ikony načítané externě (CDN) – žádná binární data v souboru -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Ikony jsou vložené přímo v souboru jako SVG (viz ICONS níže) – žádné externí načítání ikon -->

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Nunito', system-ui, sans-serif; }
  .tab-strip::-webkit-scrollbar { height: 0px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cfd3da; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes drawerIn { from { transform: translateX(30px); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .icon-btn { width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.75); }
  .icon-btn:hover { color:#fff; background:rgba(255,255,255,.11); }
  .top-icon { font-size:17px; cursor:pointer; color:inherit; }
  .top-icon:hover { color:#fff; }

  .nav-item { display:flex; align-items:center; gap:13px; padding:10px 18px; margin:0 8px 1px; border-radius:9px; cursor:pointer; font-size:14px; font-weight:600; color:#4a4660; transition:background .12s; }
  .nav-item:hover { background:#f5f3fb; }
  .nav-item.active { background:#eef4fe; color:#1572e8; font-weight:700; }
  .nav-item .nav-icon { width:20px; text-align:center; font-size:16px; color:#9a93b5; }
  .nav-item.active .nav-icon { color:#1572e8; }

  .nav-item.collapsed { justify-content:center; width:100%; padding:10px 0; margin:0 0 1px; border-radius:0; }

  .badge { border-radius:11px; min-width:21px; height:21px; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; padding:0 6px; }
  .badge-alert { background:#FF6D00; color:#fff; }
  .badge-accent { background:#1572e8; color:#fff; }
  .badge-grey { background:#e6e3ef; color:#8a84a0; }

  .tab-item { flex-shrink:0; cursor:pointer; padding:8px 17px; border-radius:6px 6px 0 0; font-size:12px; font-weight:700; white-space:nowrap; border-right:2px solid rgba(0,0,0,0.28); border-left:2px solid rgba(0,0,0,0.28); margin-bottom:-2px; transition:background .18s, color .18s; user-select:none; }

  .action-item { display:flex; align-items:center; gap:11px; padding:8px; border-radius:8px; font-size:13px; font-weight:600; white-space:nowrap; color:#5a5478; cursor:pointer; }
  .action-item:not(.disabled):hover { color:#1572e8; background:#e9f1fd; }
  .action-item.disabled { color:#c2bdd6; cursor:not-allowed; }
  .action-item .a-icon { width:18px; text-align:center; font-size:14px; color:#9a95ad; }
  .action-item.disabled .a-icon { color:#d3cfe0; }

  .item-tab { display:inline-flex; align-items:center; height:40px; padding:0 18px; cursor:pointer; white-space:nowrap; font-size:12.5px; font-weight:600; color:#263238; background:none; }
  .item-tab.active { font-weight:700; color:#1572e8; background:#fff; border-radius:10px 10px 0 0; box-shadow:0 1px 16px rgba(0,0,0,.07); clip-path:inset(-16px -16px 0 -16px); margin-bottom:-1px; position:relative; z-index:2; }

  .detail-row { display:flex; align-items:center; gap:18px; padding:14px 0; border-bottom:1px solid #f3f2f7; }
  .detail-row .lbl { width:160px; flex-shrink:0; text-align:right; font-size:12px; color:#6c757d; font-weight:600; display:flex; align-items:center; justify-content:flex-end; gap:7px; }
  .detail-row .lbl i { font-size:10px; color:#cbc6db; }
  .detail-row .val { flex:1; border:1px solid #e5e5e5; border-radius:4px; padding:9px 14px; font-size:13px; color:#1a1a1a; }

  .ic-svg { width:1em; height:1em; display:inline-block; vertical-align:-0.125em; fill:currentColor; }
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;height:100vh;overflow:hidden">

  <!-- ═══ TOP BAR ═══ -->
  <div style="flex-shrink:0;height:56px;background:#2b2d30;display:flex;align-items:center;padding:0 18px;gap:14px;z-index:40">

    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-right:4px">
      <svg viewBox="0 0 598.3 651.4" style="height:28px;width:auto;flex-shrink:0" xmlns="http://www.w3.org/2000/svg">

      </svg>
      <span style="font-weight:800;font-size:19px;color:#fff;letter-spacing:-.01em">aptien</span>
    </div>

    <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">
      <div class="icon-btn"><span data-icon="house" style="font-size:16px"></span></div>
    </div>

    <span style="color:rgba(255,255,255,.7);font-size:13.5px;font-weight:600;flex-shrink:0;white-space:nowrap">Naše skvělá firma</span>
    <div style="flex:1"></div>

    <div style="display:flex;align-items:center;gap:16px;flex-shrink:0;color:rgba(255,255,255,.65)">
      <span data-icon="magnifying-glass" class="top-icon"></span>
      <div style="position:relative;cursor:pointer">
        <span data-icon="bell" class="top-icon"></span>
        <span style="position:absolute;top:-7px;right:-9px;background:#ef4444;color:#fff;font-size:9.5px;font-weight:800;border-radius:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid #2b2d30">60</span>
      </div>
      <span data-icon="comment-dots" class="top-icon"></span>
      <span data-icon="mobile-screen-button" class="top-icon"></span>
      <span data-icon="gear" class="top-icon"></span>
      <span data-icon="right-from-bracket" class="top-icon"></span>
    </div>
  </div>

  <!-- ═══ TAB STRIP ═══ -->
  <div id="tabStrip" class="tab-strip" style="flex-shrink:0;background:#2b2d30;border-bottom:2px solid #484b50;display:flex;align-items:flex-end;padding:7px 0 0 16px;overflow-x:auto;z-index:30"></div>

  <!-- ═══ BODY ═══ -->
  <div style="flex:1;display:flex;min-height:0;overflow:hidden">

    <!-- SIDEBAR -->
    <nav id="sidebar" style="width:236px;flex-shrink:0;background:#fff;border-right:1px solid #ededf2;display:flex;flex-direction:column;overflow:hidden;padding-bottom:20px;transition:width .22s ease">
      <div id="collapseRow" style="display:flex;justify-content:flex-end;padding:8px 14px 2px">
        <span id="collapseIcon" data-icon="angles-left" style="color:#b9b4cf;font-size:15px;cursor:pointer"></span>
      </div>
      <div id="profileFull" style="display:flex;align-items:center;gap:11px;padding:6px 16px 16px">
        <div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4a90d9,#1572e8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0">HK</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;color:#2b2540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Hana Kocourková</div>
          <div style="font-size:12px;color:#9a93b5;font-weight:600;display:flex;align-items:center;gap:5px">Administrátor <span data-icon="chevron-down" style="font-size:9px"></span></div>
        </div>
        <span data-icon="gear" style="color:#c2bdd6;font-size:14px;cursor:pointer"></span>
      </div>
      <div id="profileCollapsed" style="display:none;justify-content:center;padding:6px 0 16px">
        <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#4a90d9,#1572e8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px">HK</div>
      </div>

      <div id="workLabel" style="padding:0 18px 8px;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#b0aac8">Můj pracovní prostor</div>
      <div id="navWork"></div>

      <div id="companyLabel" style="padding:18px 18px 8px;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#b0aac8">Naše firma</div>
      <div id="navCompany"></div>
    </nav>

    <!-- CONTENT AREA -->
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f5f6f7">
      <span id="contentIcon" style="font-size:40px;opacity:.18;color:#2b2d30"></span>
      <div id="contentLabel" style="font-size:20px;font-weight:800;color:#3c4150"></div>
      <div style="font-size:13px;color:#9aa2b0;margin-bottom:6px">Zobrazení položek bude přidáno v dalším kroku</div>
      <div id="openItemBtn" style="display:flex;align-items:center;gap:9px;background:#1572e8;color:#fff;font-weight:700;font-size:13px;padding:10px 22px;border-radius:22px;cursor:pointer;box-shadow:0 3px 9px rgba(21,114,232,.28)">
        <span data-icon="arrow-up-right-from-square"></span>Ukázat detail položky
      </div>
    </div>

  </div>

  <!-- ═══ ITEM DETAIL DRAWER ═══ -->
  <div id="drawerOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:50;animation:fadeIn .2s ease forwards"></div>
  <div id="drawer" style="display:none;position:fixed;top:0;right:0;bottom:0;width:78%;min-width:900px;background:#fff;z-index:51;box-shadow:-8px 0 32px rgba(0,0,0,.2);animation:drawerIn .28s ease">
    <div style="display:flex;height:100%">

      <div style="width:46px;flex-shrink:0;background:#faf9fd;border-right:1px solid #eef0f3;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:18px">
        <span data-icon="users" style="color:#9a93b5;font-size:16px"></span>
        <div style="writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:13px;color:#1572e8;letter-spacing:.02em">Jan Novák</div>
      </div>

      <div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">

        <div style="display:flex;align-items:flex-start;gap:22px;padding:28px 30px 0;flex-shrink:0">
          <div style="flex:1;min-width:0">
            <div style="font-size:36px;font-weight:300;color:#2b2540;line-height:1.05;letter-spacing:-.01em">Jan Novák</div>
            <div style="margin-top:14px;display:flex;align-items:center;gap:8px">
              <span style="display:inline-flex;align-items:center;gap:6px;background:#eceff1;color:#59676d;padding:6px 12px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.02em"><span data-icon="user" style="font-size:9px"></span>Zaměstnanec</span>
              <span style="border-radius:4px;padding:4px 10px;font-weight:800;font-size:11px;background:#00C853;color:#fff">AKTIVNÍ</span>
            </div>
            <div style="margin-top:20px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <div style="display:inline-flex;align-items:center;gap:9px;background:#1572e8;color:#fff;font-size:13px;font-weight:800;padding:10px 22px;border-radius:22px;cursor:pointer;box-shadow:0 3px 10px rgba(21,114,232,.32);letter-spacing:.02em">
                <span data-icon="file-contract"></span>Vytisknout smlouvu HPP
              </div>
              <div style="display:inline-flex;align-items:center;gap:9px;background:#f0eef6;color:#5a5478;font-size:13px;font-weight:700;padding:10px 20px;border-radius:22px;cursor:pointer">
                <span data-icon="envelope"></span>Odeslat e-mail
              </div>
            </div>
          </div>
          <div style="width:136px;height:110px;border:2px dashed #d6d2e2;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#cbc6db;flex-shrink:0">
            <span data-icon="image__regular" style="font-size:30px"></span>
          </div>
          <span id="closeDrawerBtn" data-icon="xmark" style="color:#9a93b5;font-size:26px;cursor:pointer;flex-shrink:0;margin-top:4px"></span>
        </div>

        <div style="flex:1;min-height:0;background:#f6f6f6;display:flex;gap:28px;padding:14px 26px 24px;overflow:hidden">

          <div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0">
            <div id="itemTabsRow" style="display:flex;align-items:flex-end;overflow-x:auto;flex-shrink:0"></div>
            <div style="background:#fff;flex:1;min-height:0;box-shadow:0 1px 16px rgba(0,0,0,.07);border-radius:0 10px 10px 10px;overflow:hidden;display:flex;flex-direction:column">
              <div id="itemTabBody" style="flex:1;overflow-y:auto"></div>
            </div>
          </div>

          <div id="actionRail" style="width:176px;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-top:6px"></div>

        </div>
      </div>
    </div>
  </div>

</div>

function iconSVG(name, extraStyle) {
  const ic = ICONS[name];
  if (!ic) return '';
  const style = extraStyle ? ` style="${extraStyle}"` : '';
  return `<svg class="ic-svg" viewBox="${ic.vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"${style}><path d="${ic.d}"/></svg>`;
}

function hydrateIcons(root) {
  (root || document).querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = iconSVG(el.getAttribute('data-icon'));
  });
}

function badgeClass(kind) {

function renderTabs() {
  const el = document.getElementById('tabStrip');
  el.innerHTML = '';
  TABS.forEach((tab, idx) => {
    const on = idx === state.activeTab;
    const d = document.createElement('div');
    d.className = 'tab-item';
    d.textContent = tab.label;
    d.style.background = on ? tab.c800 : tab.c50;
    d.style.color = on ? '#fff' : '#111';
    d.style.borderBottom = on ? '2px solid #f5f6f7' : 'none';
    d.onclick = () => { state.activeTab = idx; render(); };
    el.appendChild(d);
  });
}

  document.getElementById('workLabel').style.display = collapsed ? 'none' : 'block';
  document.getElementById('companyLabel').style.display = collapsed ? 'none' : 'block';

  const buildItem = (item) => {
    const on = state.activeNav === item.id;
    const d = document.createElement('div');
    d.className = 'nav-item' + (on ? ' active' : '') + (collapsed ? ' collapsed' : '');
    d.onclick = () => { state.activeNav = item.id; render(); };

    icon.className = 'nav-icon';

      const span = document.createElement('span');
      span.style.flex = '1'; span.style.whiteSpace = 'nowrap'; span.style.overflow = 'hidden'; span.style.textOverflow = 'ellipsis';
      span.textContent = item.label;
      d.appendChild(span);
      if (item.badge) {
        const b = document.createElement('span');
        b.className = badgeClass(item.badgeKind);
        b.textContent = item.badge;
        d.appendChild(b);
      }
    }
    return d;
  };

  const workEl = document.getElementById('navWork');
  workEl.innerHTML = '';
  NAV_WORK.forEach(item => workEl.appendChild(buildItem(item)));

  const companyEl = document.getElementById('navCompany');
  companyEl.innerHTML = '';
  NAV_COMPANY.forEach(item => companyEl.appendChild(buildItem(item)));
}

function renderContent() {
  const tab = TABS[state.activeTab];
  document.getElementById('contentIcon').innerHTML = iconSVG(tab.icon);
  document.getElementById('contentIcon').style.color = '#2b2d30';
  document.getElementById('contentLabel').textContent = tab.label;
}

function renderDrawer() {
  document.getElementById('drawerOverlay').style.display = state.itemOpen ? 'block' : 'none';
  document.getElementById('drawer').style.display = state.itemOpen ? 'block' : 'none';
  if (!state.itemOpen) return;

  const tabsRow = document.getElementById('itemTabsRow');
  tabsRow.innerHTML = '';
  ITEM_TABS.forEach(t => {
    const on = state.itemTab === t.key;
    const d = document.createElement('div');
    d.className = 'item-tab' + (on ? ' active' : '');
    d.textContent = t.label;
    d.onclick = () => { state.itemTab = t.key; render(); };
    tabsRow.appendChild(d);
  });

  const body = document.getElementById('itemTabBody');
  body.innerHTML = '';
  if (state.itemTab === 'detaily') {
    const wrap = document.createElement('div');
    wrap.style.padding = '24px 30px';
    DETAIL_ROWS.forEach(r => {
      const row = document.createElement('div');
      row.className = 'detail-row';
      row.innerHTML = `<div class="lbl">${r.label}${iconSVG('pen')}</div><div class="val">${r.value}</div>`;
      wrap.appendChild(row);
    });
    const plus = document.createElement('div');
    plus.style.marginTop = '22px'; plus.style.color = '#1572e8'; plus.style.fontSize = '22px'; plus.style.cursor = 'pointer';
    plus.innerHTML = iconSVG('plus');
    wrap.appendChild(plus);
    body.appendChild(wrap);
  } else if (state.itemTab === 'konverzace') {
    body.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#aaa4bf;flex-direction:column;gap:12px;padding:40px">
      ${iconSVG('comments', 'font-size:30px;color:#d6d2e2')}
      <div style="font-size:15px;font-weight:700;color:#7a7595">Konverzace</div>
      <div style="font-size:13px">Náhled konverzace bude přidán v dalším kroku.</div>
    </div>`;
  } else {
    const label = (ITEM_TABS.find(t => t.key === state.itemTab) || {}).label || '';
    body.innerHTML = `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#aaa4bf;padding:40px">
      ${iconSVG('screwdriver-wrench', 'font-size:30px;color:#d6d2e2')}
      <div style="font-size:15px;font-weight:700;color:#7a7595">${label}</div>
      <div style="font-size:13px">Tato sekce bude přidána v dalším kroku.</div>
    </div>`;
  }

  const rail = document.getElementById('actionRail');
  rail.innerHTML = '';
  ACTIONS.forEach(ac => {
    const d = document.createElement('div');
    d.className = 'action-item' + (ac.disabled ? ' disabled' : '');
    d.innerHTML = `<span class="a-icon">${iconSVG(ac.icon)}</span>${ac.label}`;
    rail.appendChild(d);
  });
  const meta = document.createElement('div');
  meta.style.marginTop = '18px'; meta.style.paddingTop = '14px'; meta.style.borderTop = '1px solid #eef0f3';
  meta.innerHTML = `
    <div style="font-size:12px;color:#9a95ad;margin-bottom:7px">ID: <b style="color:#5a5478">2481</b></div>
    <div style="font-size:12px;color:#9a95ad;margin-bottom:7px">Vytvořeno: <b style="color:#5a5478">15. 03. 2020</b></div>
    <div style="font-size:12px;color:#9a95ad;margin-bottom:7px">Vytvořil: <b style="color:#5a5478">Kocourková Hana</b></div>
    <div style="font-size:12px;color:#9a95ad">Poslední změna: <b style="color:#5a5478">12. 06. 2025</b></div>`;
  rail.appendChild(meta);
}

function render() {
  renderTabs();
  renderNav();
  renderContent();
  renderDrawer();
}

document.getElementById('collapseIcon').onclick = () => { state.sidebarCollapsed = !state.sidebarCollapsed; render(); };
document.getElementById('openItemBtn').onclick = () => { state.itemOpen = true; state.itemTab = 'detaily'; render(); };
document.getElementById('closeDrawerBtn').onclick = () => { state.itemOpen = false; render(); };
document.getElementById('drawerOverlay').onclick = () => { state.itemOpen = false; render(); };

hydrateIcons();
render();
</script>
</body>
</html>
