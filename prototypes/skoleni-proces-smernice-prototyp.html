  const qs = scored(S.test), m = S.mob, passed = S.emp.state==='passed';
  const top = `<div class="m-top"><i class="fa-solid fa-bars"></i><span class="lg">aptien</span><span class="avatar" style="background:#AA00FF;width:26px;height:26px;font-size:10px">KF</span></div>`;
  const ph1 = `<div class="phone"><div class="screen">${top}${m.push && !passed ? `<div class="push" data-a="mobPush"><span class="ap">a</span><div><b>Aptien · Nová směrnice k prostudování</b><br>Bezpečnost práce (BOZP) 2026 – přečtěte a složte test do 12. 10.</div></div>`:''}
    <div class="m-body"><div class="m-crumb"><i class="fa-solid fa-house" style="color:#1572e8"></i><i class="fa-solid fa-chevron-right" style="font-size:9px;color:#aaa"></i>Moje směrnice</div>
      <div class="m-card"><b style="font-size:14px">Zbývá vám potvrdit <span style="color:#1572e8">${passed?2:3}</span> dokumenty</b><div style="height:6px;background:#eef0f5;border-radius:99px;margin-top:8px;overflow:hidden"><i style="display:block;height:100%;width:${passed?67:50}%;background:#1572e8"></i></div><div style="font-size:11px;color:#8a90a3;margin-top:4px">${passed?4:3} z 6 potvrzeno</div></div>
      <div class="m-card">${passed?'':`<div class="m-item"><span class="m-ic" style="background:#efe9ff;color:#5b21b6"><i class="fa-solid fa-graduation-cap"></i></span><div style="flex:1;min-width:0"><b>Bezpečnost práce (BOZP)…</b><small>Test · ${qs.length} otázek</small></div><div style="text-align:right"><span class="dl green">za 5 dní</span><br><button class="m-btn" style="background:#00C853;margin-top:4px" data-a="mobStart">PŘEČÍST A TEST</button></div></div>`}
        <div class="m-item"><span class="m-ic" style="background:#fff3e0;color:#FF6D00"><i class="fa-solid fa-file-lines"></i></span><div style="flex:1;min-width:0"><b>Cestovní náhrady a diety</b><small>cestovni_nahrady.pdf</small></div><div style="text-align:right"><span class="dl orange">za 1 den</span><br><button class="m-btn" style="background:#FF6D00;margin-top:4px">POTVRDIT</button></div></div>
        <div class="m-item"><span class="m-ic" style="background:#e8f8ed;color:#2E7D32"><i class="fa-solid fa-file-lines"></i></span><div style="flex:1;min-width:0"><b>Etický kodex a whistl…</b><small>eticky_kodex.pdf</small></div><div style="text-align:right"><span class="dl green">∞ Bez termínu</span><br><button class="m-btn" style="background:#00C853;margin-top:4px">POTVRDIT</button></div></div></div>
      ${passed?'<div class="m-card" style="display:flex;gap:10px;align-items:center"><i class="fa-solid fa-award" style="color:#f8c513;font-size:20px"></i><div style="font-size:12.5px"><b>BOZP 2026 – test složen</b><br>Certifikát platný do 7. 10. 2027</div></div>':''}
    </div></div></div>`;
  const q = qs[m.q] || qs[0];
  let ph2;
  if (!q) ph2 = `<div class="phone"><div class="screen">${top}<div class="m-body">Test nemá otázky.</div></div></div>`;
  else if (m.done){
    const ok = qs.filter(x => mobCorrect(x)).length, pts = qs.filter(x=>mobCorrect(x)).reduce((s,x)=>s+x.points,0), pass = pts >= passPts();
    ph2 = `<div class="phone"><div class="screen">${top}<div class="m-body" style="text-align:center;padding-top:40px"><div style="font-size:52px">${pass?'🎉':'📘'}</div><b style="font-size:18px">${pass?'Test složen!':'Tentokrát to nevyšlo'}</b><div style="font-size:13px;color:#555;margin:8px 0 18px">${pts} z ${totalPts(S.test)} bodů · ${ok}/${qs.length} správně</div>
      ${pass?'<div class="m-card" style="text-align:left;display:flex;gap:10px;align-items:center"><i class="fa-solid fa-award" style="color:#f8c513;font-size:24px"></i><div style="font-size:12.5px"><b>Certifikát</b><br>Uložen v „O mně → Školení“</div></div>':'<div class="m-card" style="font-size:12.5px">Další pokus za 24 hodin. Zbývají 2 pokusy.</div>'}</div>
      <div class="m-foot"><button style="background:#19b394;color:#fff" data-a="mobReset">${pass?'HOTOVO':'ROZUMÍM'}</button></div></div></div>`;
  } else {
    const a = m.ans[q.id];
    const opts = q.type==='bool' ? [[true,'Ano'],[false,'Ne']].map(([v,l]) => `<div class="m-opt ${a===v?'sel':''}" data-a="mobAns" data-v="${v}"><span class="o"></span>${l}</div>`).join('')
      : q.choices.filter(c=>c.t.trim()).map(c => { const sel = q.type==='radio' ? a===c.id : (a||[]).includes(c.id); return `<div class="m-opt ${sel?'sel':''}" data-a="mobAns" data-c="${c.id}"><span class="o" style="${q.type==='checkbox'?'border-radius:5px':''}"></span>${esc(c.t)}</div>`; }).join('');
    ph2 = `<div class="phone"><div class="screen"><div class="m-top" style="background:#fff;color:#111;border-bottom:1px solid #eee"><i class="fa-solid fa-xmark" data-a="mobReset"></i><span class="lg" style="font-size:14px">Test BOZP 2026</span><span style="font-weight:800;color:#19b394;font-size:13px"><i class="fa-regular fa-clock"></i> 4:${String(52-m.q*7).padStart(2,'0')}</span></div>
      <div class="m-body"><div class="m-prog">${qs.map((x,i)=>`<i class="${i<=m.q?'on':''}"></i>`).join('')}</div><div style="font-size:11.5px;color:#8a90a3;font-weight:800">OTÁZKA ${m.q+1} Z ${qs.length}${q.type==='checkbox'?' · VÍCE ODPOVĚDÍ':''}</div>
        <div class="m-q" style="margin-top:8px"><b style="font-size:15px;line-height:1.35;display:block">${esc(q.title)}</b>${opts}</div></div>
      <div class="m-foot">${m.q>0?'<button style="background:#eef0f5;color:#555" data-a="mobPrev">Zpět</button>':''}<button style="background:#19b394;color:#fff" data-a="mobNext">${m.q===qs.length-1?'ODESLAT':'DALŠÍ'}</button></div></div></div>`;
  }
  const ph3 = `<div class="phone"><div class="screen">${top}<div class="m-body"><div class="m-crumb"><i class="fa-solid fa-house" style="color:#1572e8"></i><i class="fa-solid fa-chevron-right" style="font-size:9px;color:#aaa"></i>O mně · Školení</div>
      <div class="m-card"><b style="font-size:13px">Moje certifikáty</b>${[['Bezpečnost práce (BOZP) 2026', passed ? '7. 10. 2027':null],['Požární ochrana 2026','15. 6. 2027'],['Řidič referent','1. 3. 2027']].filter(c=>c[1]).map(c => `<div class="m-item"><span class="m-ic" style="background:#fff8e1;color:#e0a800"><i class="fa-solid fa-award"></i></span><div style="flex:1;min-width:0"><b>${c[0]}</b><small>platný do ${c[1]}</small></div><i class="fa-solid fa-download" style="color:#1572e8"></i></div>`).join('')}</div>
      <div class="m-card" style="font-size:12px;color:#666"><i class="fa-solid fa-bell" style="color:#FF6D00"></i> 30 dní před koncem platnosti přijde připomínka a školení se rozešle znovu.</div></div></div></div>`;
  return `<div class="phones"><div class="phone-col">${ph1}<div class="phone-cap">1 · Upozornění a Moje směrnice<br><span style="font-weight:600">klikněte na PŘEČÍST A TEST</span></div></div>
    <div class="phone-col">${ph2}<div class="phone-cap">2 · Test – jedna otázka na obrazovku<br><span style="font-weight:600">(dokument se otevře před první otázkou, zde zkráceno)</span></div></div>
    <div class="phone-col">${ph3}<div class="phone-cap">3 · Certifikát v profilu „O mně“</div></div></div>`;
}
function mobCorrect(q){ const a = S.mob.ans[q.id];
  if (q.type==='bool') return a===q.correct; if (q.type==='radio') return !!q.choices.find(c=>c.id===a&&c.ok);
  return Array.isArray(a) && [...a].sort().join()===q.choices.filter(c=>c.ok).map(c=>c.id).sort().join(); }

/* ---------- 6) Vyhodnocení ---------- */
function renderVyhodnoceni(){
  const e = S.emp, me = e.state==='passed' ? ['ok',e.attempts,e.pts,'7. 10.'] : e.state==='failed' ? ['bad',e.attempts,e.pts,'7. 10.'] : e.state==='confirmed' ? ['run',0,null,''] : ['wait',0,null,''];
  const data = EMPS.map((p,i) => ({p, s: i===0 ? me : EMP_STATE[i]}));
  const lbl = {ok:'SLOŽENO', bad:'NESLOŽENO', run:'ROZPRACOVÁNO', wait:'NEZAHÁJENO', late:'PO TERMÍNU'};
  const extra = {ok:268, bad:21, run:37, wait:96, late:3}; // zbytek ze 437
  const cnt = k => data.filter(d=>d.s[0]===k).length + extra[k];
  const kp = (k,col,l) => `<div class="kpi" style="border-left-color:${col}"><b>${cnt(k)}</b><span>${l}</span></div>`;
  const f = S.evFilter, shown = data.filter(d => f==='all' || d.s[0]===f);
  const qs = scored(S.test), rates = [94,97,59,71,88,91,83,76,90,64];
  const fb = (k,l) => `<button class="${f===k?'on':''}" data-a="evF" data-v="${k}">${l}</button>`;
  if (S.distMode!=='test') return `<div class="ev"><div class="crumb">Nastavení směrnic › Distribuční listy › Bezpečnost práce (BOZP) 2026</div><div class="callout amber" style="margin-top:20px"><i class="fa-solid fa-triangle-exclamation"></i><div>List zatím rozesílá dokument jen k potvrzení – vyhodnocení testu tu bude, až v kroku 3 nastavíte <b>Potvrzení + test</b>.</div><button class="btn btn-blue btn-sm" style="margin-left:auto" data-a="goStep" data-v="distribuce">KROK 3</button></div></div>`;
  return `<div class="ev"><div class="crumb">Nastavení směrnic <i class="fa-solid fa-chevron-right" style="font-size:9px"></i> <a class="num-link" data-a="goStep" data-v="distribuce">Distribuční listy</a> <i class="fa-solid fa-chevron-right" style="font-size:9px"></i> Bezpečnost práce (BOZP) 2026</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:8px"><h1 style="margin:0;font-size:22px">Bezpečnost práce (BOZP) 2026</h1>${badgeFor('test')}<span style="color:var(--muted);font-size:13px">437 příjemců · termín 12. 10. 2026</span>
      <span style="margin-left:auto;display:flex;gap:8px"><button class="btn btn-ghost btn-sm"><i class="fa-regular fa-file-excel"></i>EXPORT</button><button class="btn btn-blue btn-sm" data-a="remind"><i class="fa-solid fa-bell"></i>PŘIPOMENOUT ČEKAJÍCÍM (${cnt('wait')+cnt('run')+cnt('late')})</button></span></div>
    <div class="kpis">${kp('ok','#00C853','složilo test')}${kp('bad','#EF5350','nesložilo – vyčerpané pokusy')}${kp('run','#1572e8','rozpracováno / další pokus')}${kp('wait','#B1B2B3','zatím nezahájilo')}${kp('late','#FF6D00','po termínu')}</div>
    <div class="two"><div class="panel"><h3><i class="fa-solid fa-users" style="color:#1572e8"></i>Zaměstnanci <span style="font-weight:600;color:var(--muted2);font-size:12px">(ukázka 12 ze 437)</span></h3>
      <div class="filters">${fb('all','Všichni')}${fb('ok','Složeno')}${fb('bad','Nesloženo')}${fb('run','Rozpracováno')}${fb('wait','Nezahájeno')}</div>
      <table class="ptable"><tr><th>Zaměstnanec</th><th>Stav</th><th>Pokusy</th><th>Body</th><th>Dokončeno</th><th>Certifikát do</th><th></th></tr>
      ${shown.map(d => `<tr class="${d.p[0]===S.empName?'me':''}"><td><span style="display:flex;align-items:center;gap:8px"><span class="avatar" style="background:${d.p[2]};width:26px;height:26px;font-size:10px">${d.p[0].split(' ').map(x=>x[0]).join('')}</span><span><b>${d.p[0]}</b><br><span style="font-size:11px;color:var(--muted2)">${d.p[1]}</span></span></span></td>
        <td><span class="st ${d.s[0]}">${lbl[d.s[0]]}</span></td><td>${d.s[1]||'—'}${d.s[1]?' / '+S.settings.attempts:''}</td><td>${d.s[2]!=null?d.s[2]+' / '+totalPts(S.test):'—'}</td><td>${d.s[3]||'—'}</td><td>${d.s[0]==='ok'?'7. 10. 2027':'—'}</td>
        <td>${d.s[0]==='bad'?'<button class="btn btn-ghost btn-sm" data-a="extraTry">POVOLIT POKUS</button>':d.s[0]==='ok'?'<i class="fa-solid fa-award" style="color:#e0a800"></i>':'<i class="fa-solid fa-ellipsis-vertical" style="color:#aaa"></i>'}</td></tr>`).join('')}</table></div>
      <div class="panel"><h3><i class="fa-solid fa-chart-simple" style="color:#1572e8"></i>Úspěšnost otázek</h3><div style="font-size:12px;color:var(--muted);margin:-6px 0 12px">Kolik % zaměstnanců odpovědělo správně · z odpovědí v SurveyJS (Dashboard)</div>
        ${qs.map((q,i) => ({q, r:rates[i%rates.length]})).sort((a,b)=>a.r-b.r).map(({q,r}) => `<div class="qrate"><span class="q">${esc(q.title.length>52?q.title.slice(0,50)+'…':q.title)}</span><span class="b"><i style="width:${r}%"></i></span><b style="width:38px;text-align:right;color:${r<70?'#d9463e':'var(--title)'}">${r} %</b></div>`).join('')}
        <div class="callout amber" style="font-size:12.5px"><i class="fa-solid fa-lightbulb"></i><div>Otázku <b>„${esc((qs.map((q,i)=>({q,r:rates[i%rates.length]})).sort((a,b)=>a.r-b.r)[0]||{q:{title:''}}).q.title)}“</b> kazí 4 z 10 lidí. Možná je nejasná, nebo ji směrnice nevysvětluje dost.</div></div></div></div></div>`;
}

/* ---------- akce ---------- */
Object.assign(ACT, {
  hintToggle(){ S.hintOpen = !S.hintOpen; },
  goStep(el){ const k = el.dataset.v;
    if (k==='editor' && !S.testExists){ S.test = {title:'Školení BOZP 2026', desc:'Test ke směrnici Bezpečnost práce (BOZP) 2026.', material:{mode:'doc', docId:'sm12', text:''}, questions:[]}; S.tab='obsah'; }
    if (k==='editor') S.run = null;
    if (k==='zampc'){ S.emp.sub = S.emp.sub==='test' && S.run && !S.run.done ? 'test' : (S.emp.sub==='test'?'list':S.emp.sub); }
    S.step = k; S.distModal = false; S.aiOpen = false; S.pasteOpen = false; S.certOpen = false;
    const m = document.getElementById('mainScroll'); if (m) m.scrollTop = 0; },
  resetAll(){ location.reload(); return 'noRender'; },
  drTab(el){ S.drawerTab = el.dataset.v; },
  smAI(){ smNewTest(); S.aiOpen = true; S.ai = {src:'sm12', count:6, phase:'pick', picked:{}}; },
  smBlank(){ smNewTest(); S.test.questions = [Q.radio('',['','',''])]; },
  smPaste(){ smNewTest(); S.pasteOpen = true; },
  smTpl(){ smNewTest(); S.test.questions = sampleBOZP().questions; toast('Načtena šablona „Školení BOZP a PO“','fa-book-bookmark'); },
  smEdit(el){ S.step = 'editor'; S.tab = el.dataset.v; S.run = el.dataset.v==='vyzkouset' ? newRun() : null; },
  backToList(){ if (scored(S.test).length){ S.testExists = true; if (S.status!=='Zveřejněno') S.status = 'Koncept'; } S.step = 'smernice'; S.drawerTab = 'test'; S.run = null; },
  publish(){ S.status = 'Zveřejněno'; S.testExists = true; toast('Test zveřejněn – teď ho zařaďte do distribučního listu','fa-paper-plane'); S.step='smernice'; S.drawerTab='test'; },
  openDist(){ S.distModal = true; if (S.step!=='distribuce'){ S.step = 'distribuce'; } if (S.testExists) S.distMode = S.distMode==='pub'?'pub':'test'; },
  closeDist(){ S.distModal = false; },
  closeDistGo(){ S.distModal = false; S.step = 'smernice'; S.drawerTab = 'test'; },
  closeDistEdit(){ S.distModal = false; S.step = 'editor'; S.tab = 'nastaveni'; },
  distP(el){ S.distPrijemci = el.dataset.v; }, distM(el){ S.distMode = el.dataset.v; }, distT(el){ S.distTermin = el.dataset.v; },
  distRenew(){ S.distRenew = !S.distRenew; },
  saveDist(){ S.distModal = false; if (S.status!=='Zveřejněno' && S.distMode==='test') S.status = 'Zveřejněno';
    toast(S.distMode==='test' ? 'Uloženo – 437 zaměstnancům přišlo upozornění: přečíst a složit test' : 'Uloženo', 'fa-paper-plane'); },
  empOpen(){ if (S.emp.state==='confirmed' || S.emp.state==='failed'){ S.emp.sub='test'; S.run = empRun(); } else { S.emp.sub = 'reader'; } },
  empBack(){ S.emp.sub = 'list'; },
  empSkip(){ S.emp.readPct = 100; },
  empRead(){ S.emp.read = !S.emp.read; },
  empToTest(){ S.emp.state = 'confirmed'; S.emp.sub = 'test'; S.run = empRun(); },
  empConfirmOnly(){ S.emp.state = 'confirmed'; S.emp.sub = 'list'; toast('Dokument potvrzen'); },
  empFinish(){ const sc = scoreRun(S.run); S.emp.attempts = S.run.attempt; S.emp.pts = sc.pts; S.emp.state = sc.passed ? 'passed' : 'failed'; S.emp.sub = 'list'; S.emp.confOpen = sc.passed;
    toast(sc.passed ? 'Splněno – dokument se přesunul do Potvrzeno' : 'Test nesložen – můžete to zkusit znovu', sc.passed?'fa-circle-check':'fa-circle-info'); },
  empConf(){ S.emp.confOpen = !S.emp.confOpen; },
  mobPush(){ S.mob.push = false; },
  mobStart(){ S.mob = {push:false, q:0, ans:{}, done:false}; toast('Na telefonu se teď otevře dokument, po potvrzení test →','fa-mobile-screen'); },
  mobAns(el){ const q = scored(S.test)[S.mob.q];
    if (q.type==='bool') S.mob.ans[q.id] = el.dataset.v==='true'; else if (q.type==='radio') S.mob.ans[q.id] = el.dataset.c;
    else { const a = S.mob.ans[q.id]||[]; S.mob.ans[q.id] = a.includes(el.dataset.c) ? a.filter(x=>x!==el.dataset.c) : [...a, el.dataset.c]; } },
  mobNext(){ const qs = scored(S.test); if (S.mob.q < qs.length-1) S.mob.q++; else S.mob.done = true; },
  mobPrev(){ if (S.mob.q>0) S.mob.q--; },
  mobReset(){ S.mob = {push:false, q:0, ans:{}, done:false}; },
  evF(el){ S.evFilter = el.dataset.v; },
  remind(){ toast('Připomínka odeslána 136 zaměstnancům (push + e-mail)','fa-bell'); return 'noRender'; },
  extraTry(){ toast('Zaměstnanci byl povolen další pokus','fa-rotate-right'); return 'noRender'; },
  showCert(el){ S.certOpen = true; S.certPts = el.dataset.v; },
});
function smNewTest(){
  S.test = {title:'Školení BOZP 2026', desc:'Test ke směrnici Bezpečnost práce (BOZP) 2026.', material:{mode:'doc', docId:'sm12', text:''}, questions:[]};
  S.step = 'editor'; S.tab = 'obsah'; S.run = null; S.status = 'Koncept';
}
function empRun(){ const r = newRun(); r.pages = ['start','test']; return r; }

/* čtení dokumentu – posuvník */
document.addEventListener('scroll', e => {
  if (e.target.id !== 'readerDoc' || S.emp.readPct>=100) return;
  const el = e.target, p = Math.min(100, Math.round((el.scrollTop + el.clientHeight) / el.scrollHeight * 100));
  if (p > S.emp.readPct){ S.emp.readPct = p; const t = document.getElementById('readPctTxt'), b = document.getElementById('readPctBar'); if (t) t.textContent = p; if (b) b.style.width = p+'%';
    if (p>=100){ render(); afterRender(); } }
}, true);

/* start */
S.test = {title:'Školení BOZP 2026', desc:'', material:{mode:'doc', docId:'sm12', text:''}, questions:[]};
render();

</script>
