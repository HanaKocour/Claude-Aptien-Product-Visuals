<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Před a po</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<!--
  ŠABLONA VIZUÁLU · RODINA „DATOVÁ GRAFIKA" · Před a po
  ==========================================================================
  Zdroj grafického jazyka: „Aptien pictures template - 2026.pptx"
  (slide 113 (Excel/šanony), slide 116 „Manažer dostane přehled jednom místě"). Paleta = „Paleta 2025" z prezentace (slide 2).

  TOHLE NENÍ PROTOTYP UI. Šablona říká, jak vypadá OBRÁZEK. Vzhled je
  hotový a zmrazený — měníš JEN objekt `DATA` v <script> dole.

  JAK POUŽÍT
  1. Zkopíruj soubor pod novým názvem (např. `nis2-pred-a-po.html`).
  2. Přepiš jen hodnoty v `const DATA = {…}`  (✏️ MĚŇ).
  3. node render.js nis2-pred-a-po.html   → PNG přesně 1920 × 1080.

  ✏️ CO SE MĚNÍ (vše v DATA)
  ✏️ nadpis, podnadpis, zdroj
  ✏️ pred / po    – {stitek, polozky[3–5]}; položka = krátká věta (max ~40 znaků)

  ⛔ CO SE NEMĚNÍ
  ⛔ Rám `.dg-frame` 1920×1080, `.dg-stage` 1536×864 se `scale(1.25)`.
  ⛔ Celý obrázek je bílý: karta s rovnými rohy, bez stínu a bez šedé plochy (3. 11. 2026).
  ⛔ Nadpis Nunito 900 / 60 px (stejně jako rodina „nadpis + screenshot“) / `#311B92`, max 2 řádky. Nezmenšuj — zkrať text.
  ⛔ Popisky grafiky Poppins (jako v pptx), čísla Nunito 900.
  ⛔ Barvy jen z palety `--c1…--c6` v pevném pořadí; nové barvy nezaváděj.
  ⛔ Žádné konfety, tahy štětcem, jiskry ani gradientové pozadí plochy
     (zamítnuto 12. 8. 2026 v sablony-vizualu/README.md).
  ⛔ Fakta (lhůty, čísla) vždy s řádkem `zdroj` — bez zdroje číslo nepublikuj.
  ⛔ Vlevo vždy „bez Aptienu" (šedá, křížky), vpravo „s Aptienem" (c1, fajfky).
  ⛔ Stejný počet položek v obou sloupcích, položky si odpovídají po řádcích.
-->
<style>
  :root{
    /* Paleta 2025 (pptx, slide 2) — pořadí je pevné */
    --c1:#7602FF;  /* Deep Purple A400 — hlavní */
    --c2:#00B8D4;  /* Cyan A700 */
    --c3:#00C853;  /* Green A700 */
    --c4:#FFAB00;  /* Amber A700 */
    --c5:#E602FF;  /* Purple A400 */
    --c6:#1A237E;  /* Indigo 900 */
    --ink:#280A66; /* tmavá pro text grafiky */
    --muted:#7D90A6;
    --title:#311B92;
    --step:#3D5AFE;/* Indigo A400 — čísla kroků (pptx slide 64) */
    --bg:#fff;
  }
  body{margin:0;background:#dedde4}
  .dg-frame{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg)}
  .dg-stage{width:1536px;height:864px;transform:scale(1.25);transform-origin:top left;position:relative;
            background:var(--bg);font-family:'Poppins',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .dg-card{position:absolute;left:40px;top:40px;width:1456px;height:784px;box-sizing:border-box;background:#fff;
           border-radius:0;box-shadow:none;padding:52px 64px;overflow:hidden}
  .dg-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:60px;line-height:1.08;letter-spacing:-.015em;
            color:var(--title);margin:0;max-width:1100px}
  .dg-sub{font-size:20px;font-weight:500;color:#5b5675;margin-top:12px;max-width:1000px;line-height:1.5}
  .dg-src{position:absolute;right:170px;bottom:30px;text-align:right;font-size:12px;font-weight:500;color:var(--muted)}
  .dg-logo{position:absolute;right:56px;bottom:26px;display:flex;align-items:center;gap:6px;color:#1e1b2e;
           font-family:'Nunito',sans-serif;font-weight:800;font-size:15px}
  .dg-logo svg{width:15px;height:16px}
  .pp{position:absolute;left:64px;right:64px;top:230px;bottom:84px;display:flex;gap:0;align-items:stretch}
  .pp-col{flex:1;border-radius:22px;padding:30px 36px;display:flex;flex-direction:column}
  .pp-a{background:#f3f2f7}
  .pp-b{background:linear-gradient(135deg,#7602FF,#4a12c4);color:#fff;box-shadow:0 16px 40px rgba(118,2,255,.28)}
  .pp-tag{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
  .pp-a .pp-tag{color:var(--muted)} .pp-b .pp-tag{color:#e3d4ff}
  .pp-it{display:flex;align-items:center;gap:16px;font-size:21px;font-weight:600;line-height:1.3;flex:1;border-top:1px solid rgba(125,144,166,.18)}
  .pp-b .pp-it{border-top-color:rgba(255,255,255,.18)}
  .pp-it i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .pp-a .pp-it{color:#6e6885} .pp-a .pp-it i{background:#e4e1ec;color:#9a94ae}
  .pp-b .pp-it i{background:#00C853;color:#fff}
  .pp-arr{width:64px;display:flex;align-items:center;justify-content:center;color:var(--c1);font-size:34px}
</style>
</head>
<body>
<section class="dg-frame" id="vizual"><div class="dg-stage"><div class="dg-card">
  <h1 class="dg-title" id="t"></h1>
  <div class="dg-sub" id="s"></div>
  <div class="pp"><div class="pp-col pp-a" id="a"></div><div class="pp-arr"><i class="fa-solid fa-arrow-right"></i></div><div class="pp-col pp-b" id="b"></div></div>
  <div class="dg-src" id="src"></div>
  <div class="dg-logo">© <svg viewBox="0 0 598.3 651.4"><g transform="translate(-400.9,-201.5)"><path fill="#1e1b2e" d="m 990.7,648.5 c -7.2,-17.3 -16.8,-33.3 -25.3,-50.4 -5,-10 -10,-20 -14.9,-29.9 -12.6,-25.3 -25.2,-50.6 -37.8,-75.8 -14,-28 -27.9,-56 -41.9,-83.9 -12.7,-25.4 -25.4,-50.8 -38,-76.2 -8.8,-17.6 -17.5,-35.2 -26.3,-52.7 -2.4,-4.9 -5,-9.7 -7.3,-14.7 -0.2,-0.3 -0.3,-0.7 -0.5,-1 -18.2,-37.9 -57.1,-62.4 -99.2,-62.4 -42.4,0 -80.2,23.7 -98.8,61.6 L 415.2,635 l -1.6,3.2 c -8.3,15.7 -12.7,33.5 -12.7,51.4 0,5.6 0.4,11.1 1.2,16.6 1.4,9 3.9,17.9 7.4,26.3 5.4,12.7 13,24.1 22.7,34 l 0.3,0.3 c 49.1,53.1 151.5,86.1 267.1,86.1 31.5,0 63,-2.4 94.1,-7.6 28,-4.7 55.6,-11.7 82.1,-21.7 22.9,-8.7 45.1,-19.6 64.9,-34 12.3,-9 24.7,-18 34.3,-30 8.6,-10.7 15.2,-22.9 19.2,-36 3.3,-10.6 5,-21.6 5,-32.7 0,-14.5 -2.8,-29 -8.5,-42.4 z M 786,352 l -11.4,22.8 -172.1,345 -6.4,12.9 c -15.7,31.1 -47.9,52.4 -85.2,52.4 -52.7,0 -95.5,-42.8 -95.5,-95.5 0,-16.2 4,-31.4 11.1,-44.8 l 1.7,-3.4 183.8,-368.6 1.6,-3.3 c 15.5,-31.8 48.1,-53.6 85.8,-53.6 52.7,0 95.5,42.8 95.5,95.5 0.1,14.5 -3.1,28.3 -8.9,40.6 z m 103.3,434.4 c -52.7,0 -95.5,-42.8 -95.5,-95.5 0,-52.7 42.8,-95.5 95.5,-95.5 52.7,0 95.5,42.8 95.5,95.5 0,52.7 -42.7,95.5 -95.5,95.5 z"/></g></svg>aptien</div>
</div></div></section>
<script>
/* ✏️ MĚŇ — jen tento objekt */
const DATA = {
  "nadpis": "NIS2 bez šanonů a Excelu",
  "podnadpis": "",
  "pred": {
    "stitek": "Bez Aptienu",
    "polozky": [
      "Registr rizik v Excelu",
      "Směrnice v šanonech",
      "Lhůty hlídá člověk v kalendáři",
      "Důkazy pro audit dohledáváte týden"
    ]
  },
  "po": {
    "stitek": "S Aptienem",
    "polozky": [
      "Předpřipravený registr rizik",
      "Směrnice s potvrzením seznámení",
      "Hlídače lhůt upozorní předem",
      "Důkazy pro auditora na jednom místě"
    ]
  },
  "zdroj": ""
};
/* ⛔ odsud dál neměnit */
const $=id=>document.getElementById(id);
const PAL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const HEX=['#7602FF','#00B8D4','#00C853','#FFAB00','#E602FF','#1A237E'];
const TINT=['#f1e8ff','#e3f8fb','#e3f9ec','#fff5e0','#fde6ff','#e6e8f5'];
$('t').textContent=DATA.nadpis; $('s').textContent=DATA.podnadpis||''; if(!DATA.podnadpis) $('s').remove();
$('src').textContent=DATA.zdroj?('Zdroj: '+DATA.zdroj):'';
const fill=(id,o,ic)=>{$(id).insertAdjacentHTML('beforeend',`<div class="pp-tag">${o.stitek}</div>`+o.polozky.map(p=>`<div class="pp-it"><i class="fa-solid fa-${ic}"></i>${p}</div>`).join(''))};
fill('a',DATA.pred,'xmark'); fill('b',DATA.po,'check');
</script>
</body>
</html>
