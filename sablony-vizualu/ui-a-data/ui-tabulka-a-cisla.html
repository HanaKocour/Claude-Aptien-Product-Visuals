<!--
  ŠABLONA VIZUÁLU · RODINA „DATOVÁ GRAFIKA" · UI + čísla
  ==========================================================================
  Tvary a skladba: „Aptien pictures template - 2026.pptx"
  (slidy 36, 47–50 (screen + persona/data vedle)). Barvy, fonty a logo = Claude-Aptien-Brand-Manual (aptien_brand_brief.md).

  TOHLE NENÍ PROTOTYP UI. Šablona říká, jak vypadá OBRÁZEK. Vzhled je
  hotový a zmrazený — měníš JEN objekt `DATA` v <script> dole.

  JAK POUŽÍT
  1. Zkopíruj soubor pod novým názvem (např. `nis2-ui-cisla.html`).
  2. Přepiš jen hodnoty v `const DATA = {…}`  (✏️ MĚŇ).
  3. node render.js nis2-ui-cisla.html   → PNG přesně 1820 × 980.

  ✏️ CO SE MĚNÍ (vše v DATA)
  ✏️ motiv        – pozadí: "svetly" (bílá) | "sky" (primární Sky #6200EA) | "midnight" (Midnight #1A0050)
  ✏️ nadpis, podnadpis, zdroj
  ✏️ app          – výřez UI: firma, uzivatel, notifikace, zalozky (top bar), modul
                    {nazev, ikona, barva c800}; typ "tabulka" (pridat, sloupce,
                    radky, zvyraznit) nebo "karta" (zaznam, stav, zalozky_zaznamu,
                    pole, zvyraznit; volitelně aktivni = index otevřené záložky
                    a seznam {titulek, vpravo, radky:[{nazev, popis, ikona,
                    pocet, podil 0–100, stav, pozice:[…], lide:[iniciály], dalsi}]}
                    místo polí).
                    ukazatele [[popisek, hodnota, barva]] = dlaždice čísel na kartě
                    (nahradí místo pro obrázek); řádek seznamu umí avatar a datum.
                    zvyraznit_evidenci: false = v horní liště není zvýrazněná
                    žádná evidence (pro pohledy, které nejsou přímo v evidenci).
                    Buňka ["text","g|o|r|b|s"] = stavová pilulka.
  ✏️ data         – datový panel: typ karty | lhuty | matice | vazby | plneni | odpovedi | pozice
                    (pozice = seznámení podle pracovních pozic: polozky [{pozice, ano, celkem}])

  ⛔ CO SE NEMĚNÍ
  ⛔ Rám `.dg-frame` 1820×980 = rovnou bílá karta: rovné rohy, bez šedé plochy
     a bez stínu (rozhodnuto 3. 11. 2026). `.dg-stage` 1456×784 se `scale(1.25)`.
  ⛔ Karta je vždy bílá — nikdy se nebarví.
  ⛔ Nadpis Nunito 900 / 60 px, Midnight `#1A0050`, za ním Amber tečka (brand detail), max 2 řádky. Nezmenšuj — zkrať text.
  ⛔ Popisky grafiky Poppins (jako v pptx), čísla Nunito 900.
  ⛔ Barvy jen z brand palety `--c1…--c6` v pevném pořadí; nové barvy nezaváděj.
  ⛔ Žádné konfety, tahy štětcem, jiskry ani gradientové pozadí plochy
     (zamítnuto 12. 8. 2026 v sablony-vizualu/README.md).
  ⛔ Fakta (lhůty, čísla) vždy s řádkem `zdroj` — bez zdroje číslo nepublikuj.
  ⛔ UI panel drží styl z Claude-Aptien-Product-Visuals (top bar #424242, taby,
     toolbar, view switcher modrý, „PŘIDAT" v barvě modulu, pilulky stavů).
     Zvýraznění na produktové stránce = modrá #3D5AFE (červená jen v KB).
  ⛔ UI panel je VÝŘEZ — dole ho ořízne karta. Nezmenšuj ho, aby se vešel.
  ⛔ Datový panel vpravo = pointa pro miniaturu: čísla 34–54 px.
  ⛔ Data v UI musí odpovídat datům v panelu (stejné názvy, stejná čísla).
  ⛔ Tmavé motivy (sky, midnight) mění jen plochu, text na ploše a logo (bílé).
     UI panel, bílé karty a barvy dat zůstávají; na Sky se fialová v datech
     mění na Midnight, aby nesplynula s pozadím. Sada obrázků = jeden motiv.
-->
<style>
  :root{
    /* Paleta 2025 (pptx, slide 2) — pořadí je pevné */
    --c1:#6200EA;  /* Sky — hlavní */
    --c2:#00B4B4;  /* Teal */
    --c3:#1DB87A;  /* Emerald */
    --c4:#FFA200;  /* Amber */
    --c5:#E602FF;  /* Magenta */
    --c6:#3660FF;  /* Blue */
    --ink:#1A0050; /* Midnight — text */
    --muted:#7D90A6;
    --title:#1A0050;
    --step:#3660FF;/* Blue — čísla kroků */
    --bg:#f4f4f7;
  }
  body{margin:0;background:#dedde4}
  .dg-frame{width:1820px;height:980px;overflow:hidden;position:relative;background:#fff}
  .dg-stage{width:1456px;height:784px;transform:scale(1.25);transform-origin:top left;position:relative;
            background:#fff;font-family:'Poppins',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .dg-card{position:absolute;left:0;top:0;width:1456px;height:784px;box-sizing:border-box;background:#fff;
           border-radius:0;box-shadow:none;padding:52px 64px;overflow:hidden}
  .dg-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:60px;line-height:1.08;letter-spacing:-.015em;
            color:var(--title);margin:0;max-width:1100px}
  .dg-title:after{content:"";display:inline-block;width:.2em;height:.2em;border-radius:50%;background:#FFA200;margin-left:.08em;vertical-align:baseline}
  .dg-sub{font-size:20px;font-weight:500;color:#5b5675;margin-top:12px;max-width:1000px;line-height:1.5}
  .dg-src{position:absolute;right:170px;bottom:30px;text-align:right;font-size:12px;font-weight:500;color:var(--muted)}
  .dg-logo{position:absolute;right:56px;bottom:24px;height:24px}
  /* ---- panel aplikace = výřez UI podle Claude-Aptien-Product-Visuals ---- */
  .ap{position:absolute;left:64px;top:196px;width:840px;height:620px;background:#fff;border:1px solid #e4e2ed;border-radius:12px;
      box-shadow:0 22px 60px var(--ap-shadow);overflow:hidden;font-family:'Nunito',sans-serif;color:#1e1b2e}
  .ap-top{height:56px;background:#424242;display:flex;align-items:center;padding:0 20px;gap:14px}
  .ap-top b{color:#fff;font-weight:800;font-size:19px;letter-spacing:-.015em;margin-left:-6px}
  .ap-top em{color:#fff;font-style:normal;font-size:13px;font-weight:600;margin-left:18px;opacity:.9}
  .ap-tabs{height:30px;background:#424242;display:flex;align-items:flex-end;gap:4px;padding:0 14px}
  .ap-tab{background:#fff;border-radius:6px 6px 0 0;padding:5px 12px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .ap-tb{display:flex;align-items:center;gap:10px;padding:12px 20px}
  .ap-tb span.n{font-size:16px;font-weight:800;white-space:nowrap}
  .ap-add{display:flex;align-items:center;gap:7px;color:#fff;font-size:11px;font-weight:800;padding:6px 14px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
  .ap-srch{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #e0dded;border-radius:999px;padding:5px 14px;width:170px;font-size:12px;color:#c0bdd0}
  .ap-vs{display:flex;gap:6px;margin-left:auto}
  .ap-vs div{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1.5px solid #c8c4d8;color:#3d3a52;white-space:nowrap}
  .ap-vs div.on{border-color:#1572e8;background:#e8f0fd;color:#1572e8}
  .ap-tbl{margin:0 12px;border:1px solid #e4e2ed;border-radius:10px;overflow:hidden}
  .ap-tbl table{border-collapse:collapse;width:100%}
  .ap-tbl th{background:#f5f4fa;text-align:left;font-size:10.5px;font-weight:700;color:#1a1a1a;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid #e4e2ed;white-space:nowrap}
  .ap-tbl td{padding:9px 12px;font-size:12.5px;color:#3d3a52;border-bottom:1px solid #f0eef8;white-space:nowrap}
  .ap-tbl td.l{font-weight:600;color:#1572e8;text-decoration:underline;text-underline-offset:2px}
  .ap-tbl tr.hl td{background:#eef1ff}
  .ap-tbl tr.hl td:first-child{box-shadow:inset 3px 0 0 #3D5AFE}
  .ap-eye{width:24px;height:24px;border-radius:5px;background:#455A64;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
  .ap-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px}
  .t-g{background:#E8F5E9;color:#2E7D32}.t-o{background:#FFF3E0;color:#E65100}.t-r{background:#FFEBEE;color:#C62828}.t-b{background:#E3F2FD;color:#1565C0}.t-s{background:#eceff1;color:#59676d}
  .ap-hd{display:flex;gap:16px;padding:16px 20px 12px;border-bottom:1px solid #f0eef8}
  .ap-hd .t{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
  .ap-chips{display:flex;gap:8px;margin-top:12px;align-items:center}
  .ap-chip{background:#eceff1;color:#59676d;padding:4px 12px;border-radius:4px;font-size:10.5px;font-weight:600}
  .ap-st{display:flex;align-items:center;gap:7px;border:1px solid #e0dded;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:700;color:#4a4660}
  .ap-st i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .ap-img{width:96px;height:96px;border-radius:8px;border:2px dashed #d8d6e2;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#cdd0d8;font-size:26px;box-sizing:border-box;margin-left:auto}
  .ap-ft{display:flex;align-items:flex-end;padding:12px 20px 0}
  .ap-ft div{height:38px;padding:0 18px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#263238;white-space:nowrap}
  .ap-ft div.on{color:#1572e8;font-weight:700;background:#fff;border-radius:8px 8px 0 0;box-shadow:0 5px 20px rgba(0,0,0,.10);clip-path:inset(-30px -30px 0 -30px)}
  .ap-ft u{text-decoration:none;width:19px;height:19px;background:#1572e8;color:#fff;border-radius:50%;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .ap-f{display:flex;align-items:center;min-height:50px;border-bottom:1px solid #f0eef8;padding:8px 20px}
  .ap-f .fk{width:200px;text-align:right;font-size:12px;color:#6b6585;font-weight:600;padding-right:18px;flex-shrink:0}
  .ap-f .v{flex:1;border:1px solid #e0dded;border-radius:4px;padding:6px 10px;font-size:13px;color:#1a1a2e}
  .ap-f .v.a{border:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .ap-f.hl{background:#eef1ff;box-shadow:inset 3px 0 0 #3D5AFE}
  /* ---- datový panel vpravo ---- */
  .dp{position:absolute;left:952px;top:196px;width:440px;bottom:70px;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .dp-h{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .k{background:#fff;color:#1A0050;border-radius:18px;padding:20px 24px;border:1px solid #efedf6;box-shadow:0 10px 30px rgba(26,0,80,.08);display:flex;gap:18px;align-items:center}
  .k i.bar{width:8px;align-self:stretch;border-radius:8px;flex-shrink:0}
  .k b{display:block;font-family:'Nunito',sans-serif;font-weight:900;font-size:54px;line-height:1}
  .k span{display:block;font-size:17px;font-weight:600;margin-top:6px;line-height:1.35}
  .vt{display:flex;flex-direction:column}
  .vt-s{display:flex;gap:20px;align-items:center;position:relative;padding-bottom:22px}
  .vt-s:not(:last-child):before{content:"";position:absolute;left:52px;top:104px;bottom:0;width:4px;background:var(--vline)}
  .vt-d{width:104px;height:104px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:30px;letter-spacing:-.02em;flex-shrink:0;box-shadow:0 8px 20px rgba(26,0,80,.15)}
  .vt-s b{display:block;font-size:22px;font-weight:700;line-height:1.25}.vt-s span{display:block;font-size:15px;color:var(--fg2);font-weight:500;margin-top:3px}
  .hm{display:grid;grid-template-columns:28px repeat(5,1fr);gap:6px}
  .hm div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:26px}
  .hm div.ax{aspect-ratio:auto;color:var(--muted);font-size:13px;font-weight:700;background:none}
  .hm div.hl{outline:4px solid var(--sel);outline-offset:-2px}
  .hm-l{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted);margin-top:8px;padding-left:34px}
  .tr{display:flex;flex-direction:column;align-items:center;gap:14px}
  .tr-r{background:var(--root);color:#fff;border-radius:16px;padding:16px 26px;text-align:center;font-size:24px;font-weight:700;line-height:1.2}
  .tr-r small{display:block;font-size:13px;font-weight:600;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
  .tr-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
  .tr-n{background:#fff;color:#1A0050;border-radius:14px;padding:14px;border:1px solid #efedf6;box-shadow:0 8px 22px rgba(26,0,80,.08);display:flex;gap:12px;align-items:center}
  .tr-n i{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .tr-n b{display:block;font-size:16px;font-weight:700;line-height:1.25}.tr-n span{display:block;font-size:12.5px;color:#7D90A6;font-weight:600}
  .tr-n.hl{outline:3px solid #3D5AFE}
  .dn{display:flex;align-items:center;gap:24px}
  .dn-c{--tr:var(--track);width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .dn-c div{width:140px;height:140px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:46px;color:var(--ink)}
  .dn b{font-size:22px;font-weight:700;line-height:1.3}
  .pp-row{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;padding:10px 0;border-bottom:1px solid var(--line)}
  .av{width:36px;height:36px;border-radius:50%;background:#9e9e9e;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif}
  .pp-row em{margin-left:auto;font-style:normal;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
  /* karta záznamu se seznamem (např. distribuční seznamy) */
  .ap-sh{display:flex;align-items:center;padding:14px 20px 8px;font-size:11px;font-weight:700;color:#6b6585;letter-spacing:.05em;text-transform:uppercase}
  .ap-sh span{margin-left:auto}
  .ap-li{display:flex;align-items:center;gap:14px;min-height:56px;border-bottom:1px solid #f0eef8;padding:6px 20px}
  .ap-li .ic{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .ap-li b{display:block;font-size:14px;font-weight:800;color:#1e1b2e}.ap-li small{display:block;font-size:11.5px;font-weight:600;color:#7b7590;margin-top:2px}
  .ap-li .n{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;font-size:13px;font-weight:700;color:#3d3a52;white-space:nowrap}
  .ap-li .bar{width:120px;height:7px;border-radius:7px;background:#ece9f4;margin-top:6px;overflow:hidden}.ap-li .bar i{display:block;height:100%;border-radius:7px}
  .ap-li.hl{background:#eef1ff;box-shadow:inset 3px 0 0 #3D5AFE}
  /* datový panel: statistiky odpovědí */
  .od-top{display:flex;align-items:center;gap:18px}
  .od-top b{font-family:'Nunito',sans-serif;font-weight:900;font-size:56px;line-height:1;color:var(--fg);white-space:nowrap}
  .od-top span{font-size:20px;font-weight:700;line-height:1.3}
  .od-bar{display:flex;height:22px;border-radius:22px;overflow:hidden;gap:3px}
  .od-r{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
  .od-r i{width:14px;height:14px;border-radius:50%;flex-shrink:0}
  .od-r span{font-size:18px;font-weight:600}
  .od-r b{margin-left:auto;font-family:'Nunito',sans-serif;font-weight:900;font-size:34px;line-height:1}
  .od-ex{display:flex;align-items:center;gap:12px;background:#F5F3FF;color:#1A0050;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700}
  .od-ex i{color:#6200EA;font-size:20px}
  /* seznam: pracovní pozice (chipy) a lidé (avatary) */
  .ap-li .ch{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .ap-li .ch em{font-style:normal;font-size:10.5px;font-weight:700;color:#455A64;background:#eceff1;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .ap-li .avs{display:flex;margin-left:auto;margin-right:18px}
  .ap-li .avs span{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-5px;color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .ap-li .avs span.more{background:#eceff1;color:#455A64}
  .ap-li .avs + .n{margin-left:0}
  /* datový panel: seznámení podle pracovních pozic */
  .pz-top{display:flex;align-items:center;gap:16px;margin-bottom:4px}
  .pz-top b{font-family:'Nunito',sans-serif;font-weight:900;font-size:50px;line-height:1;color:var(--fg);white-space:nowrap}
  .pz-top span{font-size:18px;font-weight:700;line-height:1.3}
  .pz{display:flex;flex-direction:column;gap:13px}
  .pz-r{display:grid;grid-template-columns:1fr auto;align-items:end;row-gap:6px}
  .pz-r span{font-size:17px;font-weight:600;line-height:1.1}.pz-r span small{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}
  .pz-r b{font-family:'Nunito',sans-serif;font-weight:900;font-size:28px;line-height:1}
  .pz-r i{grid-column:1/3;display:block;height:12px;border-radius:12px;background:var(--track);overflow:hidden}
  .pz-r i u{display:block;height:100%;border-radius:12px}
  .pz-r.hl span{font-weight:800}
  /* ukazatele na kartě záznamu */
  .ap-kpi{display:flex;gap:10px;margin-top:14px}
  .ap-kpi div{border:1px solid #e4e2ed;border-radius:8px;padding:7px 14px;min-width:92px}
  .ap-kpi b{display:block;font-size:20px;font-weight:900;line-height:1.1}
  .ap-kpi span{display:block;font-size:10.5px;font-weight:700;color:#6b6585;margin-top:2px;white-space:nowrap}
  .ap-li .avt{width:36px;height:36px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ap-li .dt{margin-left:auto;font-size:12px;font-weight:600;color:#7b7590;white-space:nowrap}
  /* ---- motivy pozadí (DATA.motiv): svetly | sky | midnight ---- */
  .dg-frame{--fg:#1A0050;--fg2:#5b5675;--line:#efedf6;--track:#ece9f4;--vline:#e8e4f5;--sel:#1A0050;--root:var(--c1);--arrow:var(--c1);--ap-shadow:rgba(30,27,46,.16)}
  .dg-frame.m-sky{--plane:#6200EA;--title:#FFFFFF;--fg:#FFFFFF;--fg2:#EDE6FF;--muted:#D4C4FF;--line:rgba(255,255,255,.2);--track:rgba(255,255,255,.22);
     --vline:rgba(255,255,255,.3);--sel:#FFFFFF;--root:#1A0050;--arrow:#FFFFFF;--dot:#FFA200;--ap-shadow:rgba(20,0,60,.45)}
  .dg-frame.m-midnight{--plane:#1A0050;--title:#FFFFFF;--fg:#FFFFFF;--fg2:#C9BDF2;--muted:#B3A6E0;--line:rgba(255,255,255,.16);--track:rgba(255,255,255,.18);
     --vline:rgba(255,255,255,.25);--sel:#FFFFFF;--root:#6200EA;--arrow:#FFFFFF;--dot:#E602FF;--ap-shadow:rgba(0,0,0,.5)}
  .m-sky,.m-midnight,.m-sky .dg-stage,.m-midnight .dg-stage,.m-sky .dg-card,.m-midnight .dg-card{background:var(--plane)}
