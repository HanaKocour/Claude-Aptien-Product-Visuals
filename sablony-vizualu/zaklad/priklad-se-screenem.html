<!--
  ŠABLONA VIZUÁLU · RODINA C „ZÁKLAD“ · pozadí a písmo
  ==========================================================================
  Převzato z vizuálu „Aptien — Vydávání klíčů v7“ (aptien_klic_v7.html, 3. 11. 2026):
  jen ZÁKLAD – dělené pozadí, dekorativní pružina, logo, nadpis,
  podnadpis a pružina dole vlevo. Obsah vpravo (mockupy, screen, fotky) je prázdný
  slot `.zk-obsah`, do kterého se skládají komponenty.

  Formát: web – produktové stránky (viz Claude-Aptien-Product-Visuals/FORMATY.md)
  Rám 1820 × 980, vrstva 1456 × 784 se scale(1.25). Na web @2x:
     SCALE=2 node ../render.js zaklad-pozadi-a-pismo.html vystup@2x.png

  ✏️ CO SE MĚNÍ (vše v DATA dole)
  ✏️ motiv      – "svetly" (bílá + #F5F3FF) | "sky" (Sky #6200EA) | "midnight" (Midnight #1A0050)
  ✏️ nadpis     – 2–3 řádky [text, "" | "akcent"]; poslední řádek dostane tečku.
                  "akcent" = zvýrazněný řádek v barvě motivu (světlý #6200EA, sky #DDD0FF,
                  midnight #B388FF)
  ✏️ tecka      – "" = barva motivu (světlý a midnight Magenta #E602FF, sky Amber #FFA200)
  ✏️ podnadpis  – 1–2 řádky, max ~90 znaků
  ✏️ dekorace   – true/false: pružina v pravém horním rohu (7 % krytí)
  ✏️ obsah      – {typ:"prazdne"} nebo {typ:"obrazek", src:"…"}; jinak vlož
                  vlastní HTML do .zk-obsah (mockup notebooku, telefon, fotka…)

  ⛔ CO SE NEMĚNÍ
  ⛔ Pozadí: vlevo bílá #FFFFFF (sloupec 540 návrhových px), vpravo jednolitá
     #F5F3FF. Obrázek nemá zaoblené rohy ani stín – je to rovnou plocha.
  ⛔ Písmo jen Nunito: nadpis 900 / 60 px / -1.5 px, barva #1A0050, zvýrazněný
     řádek #6200EA; podnadpis 600 / 20 px #5A4070.
  ⛔ Nadpis se nezmenšuje – zkrať text (max 3 řádky po ~11 znacích).
  ⛔ Pružina dole vlevo (výška 34 px) – 6 článků a kolečko v pevném pořadí barev:
     #3CC47C #00B4B4 #6200EA #1A0050 #E602FF #FFA200, kolečko #FFCD00.
-->
<style>
  body{margin:0;background:#dedde4}
  .zk-frame{width:1820px;height:980px;overflow:hidden;position:relative;background:var(--bg-l);
            --bg-l:#FFFFFF;--bg-r:#F5F3FF;--ink:#1A0050;--akcent:#6200EA;--sub:#5A4070;--tecka:#E602FF;
            --shot-line:#e6e4ee;--shot-shadow:rgba(98,0,234,.18);--ph-line:#cfc6f2;--ph-text:#9D8FD0}
  /* motiv „sky“ – primární barva Sky #6200EA */
  .zk-frame.m-sky{--bg-l:#6200EA;--bg-r:#5300C7;--ink:#FFFFFF;--akcent:#DDD0FF;--sub:#EDE6FF;--tecka:#FFA200;
            --shot-line:rgba(255,255,255,.18);--shot-shadow:rgba(20,0,60,.45);--ph-line:rgba(255,255,255,.4);--ph-text:rgba(255,255,255,.75)}
  /* motiv „midnight“ – Midnight #1A0050 */
  .zk-frame.m-midnight{--bg-l:#1A0050;--bg-r:#240A63;--ink:#FFFFFF;--akcent:#B388FF;--sub:#C9BDF2;--tecka:#E602FF;
            --shot-line:rgba(255,255,255,.14);--shot-shadow:rgba(0,0,0,.5);--ph-line:rgba(255,255,255,.3);--ph-text:rgba(255,255,255,.65)}
  .m-sky .zk-dek path,.m-sky .zk-dek circle,.m-midnight .zk-dek path,.m-midnight .zk-dek circle{fill:#fff}
  .m-sky .zk-logo path,.m-midnight .zk-logo path{fill:#fff}
  .m-sky .zk-logo path:first-child,.m-midnight .zk-logo path:first-child{fill:rgba(255,255,255,.35)}
  .m-sky .zk-logo path:nth-child(2),.m-midnight .zk-logo path:nth-child(2){fill:rgba(255,255,255,.7)}
  .m-sky .zk-logo path:nth-child(3),.m-midnight .zk-logo path:nth-child(3){fill:#FFA200}
  .m-sky .zk-pruzina .f,.m-midnight .zk-pruzina .f{stroke:rgba(255,255,255,.4);stroke-width:1.2px;vector-effect:non-scaling-stroke}
  .m-sky .zk-pruzina .b,.m-midnight .zk-pruzina .b{fill-opacity:.4}
  .zk-stage{width:1456px;height:784px;transform:scale(1.25);transform-origin:top left;position:relative;overflow:hidden;
            background:var(--bg-l);font-family:'Nunito',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .zk-panel{position:absolute;left:540px;top:0;right:0;bottom:0;background:var(--bg-r)}
  .zk-dek{position:absolute;left:0;top:0;width:1456px;height:784px;pointer-events:none}
  .zk-logo{position:absolute;left:56px;top:48px;display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px;color:var(--ink)}
  .zk-h1{position:absolute;left:56px;top:136px;width:470px;margin:0;font-weight:900;font-size:60px;line-height:1.1;letter-spacing:-1.5px}
  .zk-h1 span{display:block}
  .zk-sub{position:absolute;left:56px;width:440px;font-weight:600;font-size:20px;line-height:1.4;color:var(--sub)}
  .zk-pruzina{position:absolute;left:56px;bottom:34px;height:34px;width:auto;overflow:visible}
  .zk-obsah{position:absolute;left:580px;top:56px;right:48px;bottom:56px;display:flex;align-items:center;justify-content:center}
  .zk-obsah img.screen{max-width:100%;max-height:100%;border-radius:12px;border:1px solid var(--shot-line);box-shadow:0 10px 30px var(--shot-shadow)}
  .zk-prazdne{width:100%;height:100%;border:2px dashed var(--ph-line);border-radius:16px;display:flex;align-items:center;justify-content:center;
              color:var(--ph-text);font-weight:700;font-size:18px}
</style>
</head>

<script>
/* ✏️ MĚŇ — jen tento objekt */
const DATA = {
  "motiv": "svetly",
  "nadpis": [
    [
      "Směrnice",
      ""
    ],
    [
      "dojde správným",
      ""
    ],
    [
      "lidem",
      "akcent"
    ]
  ],
  "tecka": "",
  "podnadpis": "Aptien rozešle novou verzi podle distribučního seznamu a hlídá potvrzení.",
  "dekorace": true,
  "obsah": {
    "typ": "obrazek",
    "src": "../assets/ukazka-screen.png"
  }
};
/* ⛔ odsud dál neměnit */
const $=id=>document.getElementById(id);
const M=DATA.motiv||'svetly'; if(M!=='svetly') document.getElementById('vizual').classList.add('m-'+M);
const barva=b=>!b?'var(--ink)':(b==='akcent'||b==='#6200EA')?'var(--akcent)':b;
$('h1').innerHTML=DATA.nadpis.map((r,i)=>`<span style="color:${barva(r[1])}">${r[0]}${i===DATA.nadpis.length-1?`<b style="color:${DATA.tecka||'var(--tecka)'}">.</b>`:''}</span>`).join('');
$('sub').textContent=DATA.podnadpis;
$('sub').style.top=(136+$('h1').offsetHeight+22)+'px';
if(!DATA.dekorace) $('dek').remove();
const O=DATA.obsah||{typ:'prazdne'};
if(O.typ==='obrazek') $('obsah').innerHTML=`<img class="screen" src="${O.src}" alt="">`;
else if(O.typ==='prazdne') $('obsah').innerHTML='<div class="zk-prazdne">Sem patří obsah: screen, mockup notebooku a telefonu, fotka</div>';
</script>
